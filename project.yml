name: FanSound
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, de, es, fr, pt-BR, it, nl]
settings:
  base:
    APP_ID: com.hgsldswk.fansound
    APP_STORE_ID: "6837222139"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  FanSound:
    type: application
    platform: iOS
    sources:
      - path: FanSound
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: FanSound/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: FanSound AppStore
  FanSoundTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FanSoundTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  FanSoundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FanSoundUITests]
    dependencies:
      - target: FanSound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FanSound
schemes:
  FanSound:
    build:
      targets:
        FanSound: all
        FanSoundTests: [test]
    test:
      config: Debug
      targets: [FanSoundTests]
  FanSoundUI:
    build:
      targets:
        FanSound: all
        FanSoundUITests: [test]
    test:
      config: Debug
      targets: [FanSoundUITests]
